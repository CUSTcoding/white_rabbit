<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vim, questionei, decifrei e libertei-me.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#070304;--ink:#e9d8cf;--dim:#a08a82;--blood:#c1121f;--line:#3a1216;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070304;--ink:#e9d8cf;--dim:#a08a82;--blood:#c1121f;--line:#3a1216}}
:root[data-theme="dark"]{--bg:#070304;--ink:#e9d8cf;--dim:#a08a82;--blood:#c1121f;--line:#3a1216}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.25rem;line-height:1.65}
.hero{position:relative}
.hero img{display:block;width:100%;height:auto;min-height:260px;object-fit:cover}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,var(--bg))}
main{max-width:40rem;margin:0 auto;padding:3rem 1.25rem 5rem}
h1{font-weight:400;font-style:italic;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.2;margin:0 0 1.5rem}
h2{font-weight:600;font-size:1.5rem;margin:3.5rem 0 1rem}
p{margin:0 0 1.2rem}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:.85rem;color:var(--dim);letter-spacing:.04em}
ol{list-style:none;padding:0;margin:0;border-left:1px solid var(--line)}
li{padding:0 0 1.6rem 1.5rem;position:relative}
li::before{content:"";position:absolute;left:-5px;top:.7rem;width:9px;height:9px;border-radius:50%;background:var(--blood)}
li b{display:block;font-weight:600}
.parallel{border-top:1px solid var(--line);margin-top:3rem;padding-top:1rem}
.gate{margin-top:3rem;padding:1.5rem;border:1px solid var(--blood);text-align:center}
.gate .mono{color:var(--ink)}
a{color:var(--blood)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.blink{animation:b 1.2s steps(2) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
